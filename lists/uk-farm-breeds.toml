# UK farm breeds for the v2 "Farm breeds" set: 10 cattle, 10 sheep, 5 outdoor pigs.
#
# Breeds are not taxa on iNaturalist, and farm animals are recorded as captive (casual
# grade), so photos come from Wikimedia Commons only (SPEC-v2 section 6.2). Each
# breed's Commons category and Wikipedia article were checked on 2026-10-10
# (scripts/verify_v2_breeds*.py).
#
# The rank order is indicative. It is based on:
#   Cattle: BCMS registrations as reported by AHDB (Holstein Friesian 19% of the GB herd,
#     Aberdeen Angus cross just under 12% on 1 Jan 2023) and by breed societies (Limousin,
#     Aberdeen Angus, Charolais, British Blue and Simmental lead the beef-sired
#     registrations).
#   Sheep: the AHDB/Signet 2020 Sheep Breed Survey (Welsh Mountain, Scottish Blackface and
#     Swaledale lead the purebred hill ewes; Lleyn leads the non-hill ewes; Mules are about
#     19% of the national flock; Texel and Suffolk are the most-used rams; Bluefaced
#     Leicester sires the Mule).
#   Pigs: native breeds commonly kept outdoors, ranked by pedigree popularity as reported
#     by the British Pig Association (Gloucestershire Old Spots, then British Saddleback,
#     then Oxford Sandy and Black).
# Highland (cattle #10) and Berkshire (pigs #5) were confirmed on 2026-10-10.
#
# Never change a `key`: note GUIDs are built from it. `photos` pins reviewed Commons file
# titles; it is filled once by the photo-review step (SPEC-v2 section 6.2) and starts empty.

