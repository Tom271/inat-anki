# Copy to inat-anki.toml (git-ignored) and edit. Command-line flags override these.
# Keys match the long flag names; dashes or underscores both work.

user = "your-inat-login"

# Output .apkg. Default: ./iNaturalist-<user>-<YYYY-MM-DD>.apkg
# out = "iNaturalist.apkg"

# Photo cache and state. Keep it between runs: that is what makes them incremental.
cache-dir = "inat-cache"

# "large" (~1024 px, default) or "medium" (~500 px). Changing it re-downloads photos.
photo-size = "large"

# Ask before downloading more photos than this.
warn-threshold = 200

# Requests per second; at most 1.1.
rate = 1.0

# Common names are chosen for this place (6857 = United Kingdom) and locale.
place-id = 6857
locale = "en"
